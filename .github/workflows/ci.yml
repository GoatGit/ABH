# Resource note: core 'Control Snapshot' (OPA WASM evaluation) transiently peaks
# around 2GB RSS inside actions.test.ts; GitHub runners (16GB) are sufficient,
# but sub-4GB local Docker VMs will OOM-kill that test file (SIGKILL, not a
# product defect). Keep runner memory >= 8GB if self-hosting.
name: ABH checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Core's offline-signature tests target the cosign 2.x CLI; 3.x removed --tlog-upload.
      - uses: sigstore/cosign-installer@v3.9.2
        with:
          cosign-release-version: 'v2.5.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          ABH_TEST_COSIGN: /usr/local/bin/cosign
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # test:e2e rebuilds the workbench itself with WORKBENCH_E2E=1; skip that copy here.
      - run: pnpm -r --filter '!@abh/workbench' build
      - name: Install Playwright Chromium
        run: pnpm --filter @abh/workbench exec playwright install --with-deps chromium
      - name: Workbench e2e
        run: pnpm --filter @abh/workbench test:e2e
