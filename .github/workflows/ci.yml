name: ABH checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Core's offline-signature tests target the cosign 2.x CLI; 3.x removed --tlog-upload.
      - uses: sigstore/cosign-installer@v3.9.2
        with:
          cosign-release-version: 'v2.5.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          ABH_TEST_COSIGN: cosign
