version: 0.1.0
status: ContractOnly
commonErrors: [INVALID_ARGUMENT, SCHEMA_UNSUPPORTED, FORBIDDEN, CONTEXT_EXPIRED, RESOURCE_NOT_FOUND, DEPENDENCY_UNAVAILABLE, DEPENDENCY_TIMEOUT, INTERNAL_ERROR]
ports:
  IdentityProviderPort:
    owner: Identity
    caller: Ingress
    implementer: IdentityAdapter
    source: docs/V1/10-ABH详细设计/20-Interaction与Identity详细设计.md
    methods:
      verify:
        request: IdentityVerifyRequest
        response: VerifiedIdentity
        effect: Read
        context: PreAuthentication
        errors: [UNAUTHENTICATED]
  DurableExecutionPort:
    owner: DurableExecution
    caller: OwnerOutboxPublisher
    implementer: PgBossAdapter
    source: docs/V1/10-ABH详细设计/27-Durable-Execution详细设计.md
    methods:
      enqueue:
        request: EnqueueJobRequest
        permission: abh.runtime.enqueue
        targetTypes: [abh.action, abh.operation, abh.decision, abh.pack-inspection-job]
        purpose: abh.runtime.deliver
        response: EnqueuedJob
        effect: DurableWrite
        context: Request
        tracking: JobRef
        errors: [IDEMPOTENCY_CONFLICT]
      scheduleWakeup:
        request: ScheduleWakeupRequest
        permission: abh.runtime.schedule-wakeup
        targetTypes: [abh.action, abh.operation, abh.decision]
        purpose: abh.runtime.deliver
        response: ScheduledWakeup
        effect: DurableWrite
        context: Request
        tracking: WaitRef
        errors: [IDEMPOTENCY_CONFLICT]
      cancelWakeup:
        request: CancelWakeupRequest
        permission: abh.runtime.cancel-wakeup
        targetTypes: [abh.durable-wait]
        purpose: abh.runtime.deliver
        response: CancelledWakeup
        effect: DurableWrite
        context: Request
        tracking: WaitRef
        errors: [VERSION_CONFLICT]
      signal:
        request: SignalWaitRequest
        permission: abh.runtime.signal
        targetTypes: [abh.action, abh.operation, abh.decision]
        purpose: abh.runtime.deliver
        response: SignalledWait
        effect: DurableWrite
        context: Request
        tracking: WaitRef
        errors: [IDEMPOTENCY_CONFLICT]
      inspect:
        request: InspectDeliveryRequest
        permission: abh.runtime.inspect
        targetTypes: [abh.job, abh.durable-wait]
        purpose: abh.runtime.deliver
        response: DeliveryInspection
        effect: Read
        context: Request
        errors: []
      drain:
        request: DrainQueueRequest
        permission: abh.runtime.drain
        targetTypes: [abh.organization]
        purpose: abh.runtime.deliver
        response: DrainReport
        effect: Read
        context: Request
        errors: []
  ObjectStorePort:
    owner: ArtifactStore
    caller: ArtifactOwner
    implementer: ObjectStoreAdapter
    source: docs/V1/10-ABH详细设计/28-Data-Artifact与Audit详细设计.md
    methods:
      put:
        request: PutObjectRequest
        permission: abh.artifacts.store
        targetTypes: [abh.artifact]
        purpose: abh.artifact.manage
        response: ObjectDescriptor
        effect: DurableWrite
        context: Authorized
        tracking: ArtifactRef
        inputStream: true
        errors: [IDEMPOTENCY_CONFLICT, LIMIT_EXCEEDED, PURPOSE_DENIED]
      read:
        request: ReadObjectRequest
        permission: abh.artifacts.read
        targetTypes: [abh.stored-object]
        purpose: abh.artifact.read
        response: ReadObjectDescriptor
        effect: Read
        context: Authorized
        outputStream: true
        errors: [PURPOSE_DENIED]
      stat:
        request: StatObjectRequest
        permission: abh.artifacts.stat
        targetTypes: [abh.stored-object]
        purpose: abh.artifact.read
        response: ObjectDescriptor
        effect: Read
        context: Authorized
        errors: [PURPOSE_DENIED]
      delete:
        request: DeleteObjectRequest
        permission: abh.artifacts.delete
        targetTypes: [abh.stored-object]
        purpose: abh.artifact.manage
        response: DeletedObject
        effect: DurableWrite
        context: Authorized
        tracking: StoredObjectRef
        errors: [IDEMPOTENCY_CONFLICT, PURPOSE_DENIED]
